# .github/workflows/deploy.yml
name: CI/CD Pipeline

# 触发器：当 main 分支有 push 时运行
on:
  push:
    branches: [main]
  # 也可以手动触发（在 GitHub 界面点按钮运行）
  workflow_dispatch:

jobs:
  # 任务名，可以自定义
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 部署到 gh-pages 需要写入权限

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 pnpm（关键修复）
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9  # 或指定具体版本如 9.1.0，不指定会用 package.json 里的 packageManager 字段

      # 3. 设置 Node 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'   # pnpm 缓存
          cache-dependency-path: pnpm-lock.yaml

      # 4. 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. 构建生产资源
      - name: Build
        run: pnpm run build
        env:
          CI: true

      # 6. 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
